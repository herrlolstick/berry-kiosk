<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>berry-kiosk</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/library.css">
  <link rel="stylesheet" href="/css/upload.css">
  <link rel="stylesheet" href="/css/albums.css">
  <link rel="stylesheet" href="/css/settings.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="card">
      <h1><img src="/assets/icon.svg" alt=""> berry-kiosk</h1>
      <label>Benutzername <input name="username" value="admin" autocomplete="username" required></label>
      <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Anmelden</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <button id="menu" class="icon-button" aria-label="Menü">☰</button>
      <a class="brand" href="#/"><img src="/assets/icon.svg" alt=""> berry-kiosk</a>
      <nav id="nav"></nav>
      <span id="user" class="muted"></span>
      <button id="logout" class="secondary">Abmelden</button>
    </header>
    <main id="view"></main>
  </div>
</body>
</html>
