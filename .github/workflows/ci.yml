name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  raspberry-pi-os:
    name: Raspberry Pi OS (arm64, Debian trixie)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5

      - name: Pakete installieren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools qt6-httpserver-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            libqt6sql6-sqlite libexiv2-dev libgl-dev libegl-dev \
            qt6-websockets-dev

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS (Entwicklung)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pakete installieren
        run: brew install qt exiv2 ninja

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
