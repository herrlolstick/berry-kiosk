name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  raspberry-pi-os:
    name: Raspberry Pi OS (arm64, Debian trixie)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Pakete installieren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools qt6-httpserver-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            libqt6sql6-sqlite libexiv2-dev libgl-dev libegl-dev \
            qt6-websockets-dev dpkg-dev file

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure

      - name: Paket bauen
        run: |
          cd build && cpack -G DEB
          dpkg-deb --info berry-kiosk_*.deb
          dpkg-deb --contents berry-kiosk_*.deb

      # Installs the package into the container: catches broken dependencies
      # and maintainer scripts. systemd does not run here, but systemd-tmpfiles
      # is installed so postinst takes the same path as on a Pi.
      - name: Paket installieren
        run: |
          apt-get install -y systemd
          apt-get install -y ./build/berry-kiosk_*.deb
          id berry-kiosk
          check() { test "$(stat -c '%U:%G %a' "$1")" = "$2" || { stat "$1"; exit 1; }; }
          check /var/lib/berry-kiosk "berry-kiosk:berry-kiosk 750"
          check /var/lib/berry-kiosk/media "berry-kiosk:berry-kiosk 2775"
          check /var/lib/berry-kiosk/state "berry-kiosk:berry-kiosk 700"
          check /var/lib/berry-kiosk/config.json "berry-kiosk:berry-kiosk 640"
          test -x /usr/bin/berry-kiosk-display && test -x /usr/bin/berry-kiosk-admin
          berry-kiosk-admin --version

      # 1.0.0 left a root-owned config.json behind; postinst must repair it
      # without losing its content
      - name: Reparatur einer 1.0.0-Installation
        run: |
          cfg=/var/lib/berry-kiosk/config.json
          echo '{"profile": "public"}' > "$cfg"
          chown root:root "$cfg" && chmod 0644 "$cfg"
          dpkg-reconfigure berry-kiosk
          test "$(stat -c '%U:%G %a' "$cfg")" = "berry-kiosk:berry-kiosk 640"
          grep -q public "$cfg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: berry-kiosk-deb-arm64
          path: build/berry-kiosk_*.deb

  macos:
    name: macOS (Entwicklung)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Pakete installieren
        run: brew install qt exiv2 ninja

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Testen
        run: ctest --test-dir build --output-on-failure
