# berry-kiosk data directory. systemd-tmpfiles refuses to follow symlinks
# that an unprivileged user planted, unlike a shell script running as root.
d /var/lib/berry-kiosk        0750 berry-kiosk berry-kiosk -
# Group-writable so people in the group berry-kiosk can copy pictures in
d /var/lib/berry-kiosk/media  2775 berry-kiosk berry-kiosk -
d /var/lib/berry-kiosk/state  0700 berry-kiosk berry-kiosk -
# config.json is copied by postinst as the service user: a root-owned file
# here would make tmpfiles refuse the chown ("unsafe path transition").
